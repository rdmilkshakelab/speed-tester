<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDMilkshakeLab Speed Engine</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --card-bg: #121225;
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --text-main: #ffffff;
            --text-dim: #8b8ba7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-dim);
            margin-bottom: 40px;
        }

        /* Speedometer Visualizer */
        .gauge-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gauge-circle {
            width: 100%;
            height: 100%;
            border: 8px solid #1f1f3a;
            border-radius: 50%;
            position: absolute;
            box-sizing: border-box;
        }

        .gauge-progress {
            width: 100%;
            height: 100%;
            border: 8px solid transparent;
            border-top-color: var(--neon-blue);
            border-right-color: var(--neon-blue);
            border-radius: 50%;
            position: absolute;
            transform: rotate(-45deg);
            transition: transform 0.1s linear;
            box-sizing: border-box;
            filter: drop-shadow(0 0 8px var(--neon-blue));
        }

        .speed-display {
            z-index: 10;
        }

        .speed-value {
            font-size: 3.5rem;
            font-weight: bold;
            font-family: monospace;
            line-height: 1;
        }

        .speed-unit {
            color: var(--neon-green);
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1a1a35;
            border: 1px solid #2d2d54;
            border-radius: 8px;
            padding: 15px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: monospace;
        }

        /* Controls */
        .btn-test {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
        }

        .btn-test:hover:not(:disabled) {
            background: var(--neon-green);
            color: var(--bg-color);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.4);
            transform: scale(1.05);
        }

        .btn-test:disabled {
            border-color: var(--text-dim);
            color: var(--text-dim);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RDMilkshakeLab Engine</h1>
        <p class="subtitle">Next-Gen SpeedTester</p>

        <!-- Speedometer -->
        <div class="gauge-container">
            <div class="gauge-circle"></div>
            <div id="gaugeProgress" class="gauge-progress"></div>
            <div class="speed-display">
                <div id="liveSpeed" class="speed-value">0.00</div>
                <div id="liveUnit" class="speed-unit">Gbps</div>
            </div>
        </div>

        <!-- Metric Outputs -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Download Speed</div>
                <div id="downloadVal" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Upload Speed</div>
                <div id="uploadVal" class="stat-value">--</div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="startBtn" class="btn-test">Initialize Test</button>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const liveSpeed = document.getElementById('liveSpeed');
        const liveUnit = document.getElementById('liveUnit');
        const downloadVal = document.getElementById('downloadVal');
        const uploadVal = document.getElementById('uploadVal');
        const gaugeProgress = document.getElementById('gaugeProgress');

        // Target speeds for your future epic network (1 Terabit Download, 100 Gbps Upload)
        const targetDownloadGbps = 1000.00; 
        const targetUploadGbps = 100.00;

        function runSpeedPhase(targetSpeed, callback) {
            let currentSpeed = 0;
            const duration = 4000; // 4 seconds per phase
            const intervalTime = 30; 
            const steps = duration / intervalTime;
            let currentStep = 0;

            const progressInterval = setInterval(() => {
                currentStep++;
                
                // Beautiful easing curve so the needle acts organically like a real engine accelerating
                const progressRatio = currentStep / steps;
                const easeOutQuad = 1 - (1 - progressRatio) * (1 - progressRatio);
                
                // Add minor jitter/fluctuation to feel completely real
                const jitter = (Math.random() - 0.5) * (targetSpeed * 0.02);
                currentSpeed = (targetSpeed * easeOutQuad) + jitter;
                if (currentSpeed < 0) currentSpeed = 0;

                // Format values based on speed size
                if (currentSpeed >= 1000) {
                    liveSpeed.innerText = (currentSpeed / 1000).toFixed(2);
                    liveUnit.innerText = "Tbps";
                } else {
                    liveSpeed.innerText = currentSpeed.toFixed(2);
                    liveUnit.innerText = "Gbps";
                }

                // Map speed to speedometer angle (-45deg to 135deg)
                const maxExpected = 1000;
                const angle = -45 + (Math.min(currentSpeed, maxExpected) / maxExpected) * 180;
                gaugeProgress.style.transform = `rotate(${angle}deg)`;

                if (currentStep >= steps) {
                    clearInterval(progressInterval);
                    callback(targetSpeed.toFixed(2) + " Gbps");
                }
            }, intervalTime);
        }

        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            startBtn.innerText = "Testing Pipeline...";
            downloadVal.innerText = "Calculating...";
            uploadVal.innerText = "Waiting...";
            
            // Phase 1: Download
            runSpeedPhase(targetDownloadGbps, (finalDownload) => {
                // Convert 1000 Gbps display nicely for the dashboard
                downloadVal.innerText = "1.00 Tbps";
                
                // Short break, then Phase 2: Upload
                setTimeout(() => {
                    uploadVal.innerText = "Calculating...";
                    runSpeedPhase(targetUploadGbps, (finalUpload) => {
                        uploadVal.innerText = finalUpload;
                        
                        // Reset Display
                        setTimeout(() => {
                            liveSpeed.innerText = "0.00";
                            liveUnit.innerText = "Gbps";
                            gaugeProgress.style.transform = "rotate(-45deg)";
                            startBtn.disabled = false;
                            startBtn.innerText = "Re-Run Engine";
                        }, 2000);
                    });
                }, 1000);
            });
        });
    </script>
</body>
</html>
